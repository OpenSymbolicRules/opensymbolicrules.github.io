# OpenSymbolicRules web site (Hugo + vendored Hugo Book theme).
# Data under data/generated/ is produced by `just sitegen` from read-only
# checkouts of the project repositories; never edit it by hand.
baseURL = "https://opensymbolicrules.github.io/"
title = "OpenSymbolicRules"
locale = "en"
theme = "hugo-book"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
enableGitInfo = false

[markup.goldmark.renderer]
  unsafe = true
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

# llms.txt (an index for language models, https://llmstxt.org) and
# llms-full.txt (the full text, with the registry as data) are generated
# at every build from the same pages and data as the HTML site.
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true
[outputFormats.llmsfull]
  mediaType = "text/plain"
  baseName = "llms-full"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "llms", "llmsfull"]
  section = ["HTML", "RSS"]

[params]
  description = "Open, language-neutral rewrite rules for computer algebra, with explicit validity conditions and Lean proofs or counterexamples."
  BookTheme = "osr"
  BookLogo = "generated/brand/logo.png"
  BookFavicon = "generated/brand/favicon.png"
  BookToC = true
  BookSection = "*"
  BookSearch = true
  BookComments = false
  BookPortableLinks = true
  BookServiceWorker = false
  BookRepo = "https://github.com/OpenSymbolicRules/opensymbolicrules.github.io"
  BookDateFormat = "2006-01-02"

[menu]
  [[menu.after]]
    name = "GitHub organization"
    url = "https://github.com/OpenSymbolicRules"
    weight = 10
  [[menu.after]]
    name = "Specification"
    url = "https://github.com/OpenSymbolicRules/Specification/blob/main/docs/osr-v1.md"
    weight = 20

[sitemap]
  changeFreq = "weekly"
